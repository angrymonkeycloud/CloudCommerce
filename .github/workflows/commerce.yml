name: Commerce ecosystem

on:
  push:
    branches: [main]
    paths:
      - 'CloudPayments*/**'
      - 'CloudLogistics*/**'
      - 'CloudBooking*/**'
      - 'CloudCommerce*/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/commerce.yml'
  pull_request:
    paths:
      - 'CloudPayments*/**'
      - 'CloudLogistics*/**'
      - 'CloudBooking*/**'
      - 'CloudCommerce*/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/commerce.yml'

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: payments
            project: CloudPayments.Tests/CloudPayments.Tests.csproj
          - domain: payment-providers
            project: CloudPayments.Providers.Tests/CloudPayments.Providers.Tests.csproj
          - domain: logistics
            project: CloudLogistics.Tests/CloudLogistics.Tests.csproj
          - domain: logistics-providers
            project: CloudLogistics.Providers.Tests/CloudLogistics.Providers.Tests.csproj
          - domain: booking
            project: CloudBooking.Tests/CloudBooking.Tests.csproj
          - domain: commerce
            project: CloudCommerce.Tests/CloudCommerce.Tests.csproj
          - domain: demo
            project: CloudCommerce.Demo.Tests/CloudCommerce.Demo.Tests.csproj

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ matrix.project }}"

      - name: Test
        run: dotnet test "${{ matrix.project }}" --configuration Release --no-restore --logger "trx;LogFileName=${{ matrix.domain }}.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-${{ matrix.domain }}-results
          path: TestResults
          if-no-files-found: warn

  package:
    name: Build demo and validate packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build demo and UI
        run: |
          dotnet build CloudCommerce.Components/CloudCommerce.Components.csproj --configuration Release
          dotnet build CloudCommerce.Demo/CloudCommerce.Demo.csproj --configuration Release

      - name: Pack public libraries
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            CloudPayments/CloudPayments.csproj
            CloudPayments.Stripe/CloudPayments.Stripe.csproj
            CloudPayments.PayPal/CloudPayments.PayPal.csproj
            CloudPayments.Adyen/CloudPayments.Adyen.csproj
            CloudPayments.MyFatoorah/CloudPayments.MyFatoorah.csproj
            CloudPayments.SkipCash/CloudPayments.SkipCash.csproj
            CloudPayments.Tap/CloudPayments.Tap.csproj
            CloudPayments.PayTabs/CloudPayments.PayTabs.csproj
            CloudLogistics/CloudLogistics.csproj
            CloudLogistics.Aramex/CloudLogistics.Aramex.csproj
            CloudLogistics.DhlExpress/CloudLogistics.DhlExpress.csproj
            CloudLogistics.FedEx/CloudLogistics.FedEx.csproj
            CloudBooking/CloudBooking.csproj
            CloudCommerce/CloudCommerce.csproj
            CloudCommerce.Components/CloudCommerce.Components.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" --configuration Release --output artifacts
          done

      - name: Validate documentation and public boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CloudPayments/README.md
          test -f CloudLogistics/README.md
          test -f CloudBooking/README.md
          test -f CloudCommerce/README.md
          test -f CloudCommerce.Components/README.md
          test -f CloudCommerce.Demo/README.md
          test -f CloudPayments/docs/index.md
          test -f CloudPayments/docs/providers.md
          test -f CloudLogistics/docs/index.md
          test -f CloudLogistics/docs/carriers.md
          test -f CloudBooking/docs/index.md
          test -f CloudCommerce/docs/index.md
          test -f CloudCommerce/docs/demo.md
          test -f CloudCommerce.Components/src/css/cloud-commerce.less
          if grep -R "CDM.CloudCommerce\|Cloud.CDM" CloudPayments* CloudLogistics* CloudBooking* CloudCommerce* --include='*.csproj' --include='*.cs'; then
            echo "::error::A public commerce project references private CDM code."
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: commerce-packages
          path: artifacts

  workshop:
    name: Publish and exercise developer workshop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install and audit asset dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Verify generated assets
        run: |
          npm run build:demo-assets
          git diff --exit-code -- CloudCommerce.Demo/wwwroot CloudCommerce.Components/wwwroot
      - name: Publish workshop
        run: dotnet publish CloudCommerce.Demo --configuration Release --output artifacts/demo-host
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise all workshop routes and workflows
        run: npm run test:demo-browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workshop-browser
          path: artifacts/workshop
          if-no-files-found: warn
